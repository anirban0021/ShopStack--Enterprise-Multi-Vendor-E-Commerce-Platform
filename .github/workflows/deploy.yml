name: Deploy ShopStack to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Sync Files to AWS EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          target: "/home/ubuntu/ShopStack"
          source: "backend/**,frontend/**,deploy/**,docker-compose.yml,.env.example,README.md"
          overwrite: true

      - name: Rebuild and Restart Docker Containers on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Navigating to /home/ubuntu/ShopStack..."
            cd /home/ubuntu/ShopStack

            # Create .env if it does not exist
            if [ ! -f .env ]; then
              echo "⚙️ Creating .env from .env.example..."
              cp .env.example .env
            fi

            # Ensure scripts have execute permissions
            chmod +x deploy/*.sh 2>/dev/null || true

            # Build and start Docker containers
            echo "🏗️ Building and restarting Docker containers..."
            sudo docker compose down --remove-orphans || true
            sudo docker compose build
            sudo docker compose up -d

            echo "========================================="
            echo "📊 Docker Container Status:"
            sudo docker compose ps
            echo "========================================="
            echo "🎉 Deployment to AWS EC2 successfully completed!"
