name: Deploy ShopStack to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync Files to AWS EC2 via Rsync
        run: |
          echo "🚀 Syncing files to EC2 (${{ secrets.EC2_HOST }})..."
          rsync -avz \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'target' \
            --exclude 'dist' \
            --exclude '*.pem' \
            --exclude '*.key' \
            --exclude '.env' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/ShopStack/

      - name: Rebuild and Restart Docker Containers on EC2
        run: |
          echo "🐳 Rebuilding and restarting Docker containers on EC2..."
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /home/ubuntu/ShopStack

            # Create .env from template if missing
            if [ ! -f .env ]; then
              echo "⚙️ Creating .env from .env.example..."
              cp .env.example .env
            fi

            # Ensure script execution permissions
            chmod +x deploy/*.sh 2>/dev/null || true

            # Rebuild and restart containers
            sudo docker compose down --remove-orphans || true
            sudo docker compose build
            sudo docker compose up -d

            echo "========================================="
            echo "📊 Docker Container Status:"
            sudo docker compose ps
            echo "========================================="
            echo "🎉 Deployment to AWS EC2 successfully completed!"
          EOF
